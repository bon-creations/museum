.sheet.char{display:block;background:var(--ochre-soft);transform:rotate(-.5deg);padding:22px 16px 16px;overflow:hidden}

.sticker.ch{float:right;width:132px;margin:-6px 0 6px 12px;shape-outside:margin-box}
.secret{display:inline-block;clear:both;margin-top:6px;padding:2px 12px;border:2px dashed var(--khaki);border-radius:4px;background:var(--card);font-size:15px;line-height:1.7}

.house{width:54px;height:54px;color:var(--khaki)}
.sticker{display:block;height:auto;flex:none}

C/g%3E%3Ccircle cx='6' cy='68' r='3' fill='%237A2434' stroke='%234F5A26' stroke-width='1.2'/%3E%3Ccircle cx='38' cy='192' r='3' fill='%237A2434' stroke='%234F5A26' stroke-width='1.2'/%3E%3C/svg%3E") repeat-y center top;opacity:.8;pointer-events:none;z-index:0}
