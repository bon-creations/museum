<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>戦略のメガリス 体験版</title>
<link rel="manifest" href="manifest-oko.webmanifest" id="mfLink">
<link rel="apple-touch-icon" href="icons/oko-180.png" id="atiLink">
<link rel="icon" type="image/png" href="icons/oko-96.png" id="icoLink">
<meta name="theme-color" content="#141a2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="戦略のメガリス">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#141a2b;--panel:#1f2845;--panel2:#2a3560;--gold:#f2c14e;--ink:#f4f1e8;--mute:#9aa6cf;--red:#e85d5d;--blue:#5da9e8;--green:#6fcf8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:#0b0f1c;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior:none}
#app{position:relative;width:100%;max-width:480px;margin:0 auto;height:100dvh;min-height:560px;display:flex;flex-direction:column;background:linear-gradient(180deg,#1a2240,#101528);overflow-x:hidden;overflow-y:auto}
#top{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0e1326;border-bottom:2px solid #2d3a6e;font-size:13px}
#stageName{font-weight:900;color:var(--gold);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#turnInfo{color:var(--mute)}
.ibtn{background:var(--panel2);color:var(--ink);border:0;border-radius:8px;padding:5px 9px;font:inherit;font-size:13px}
#boardWrap{--W:7;--H:7;position:relative;width:min(100%,calc((100dvh - 262px)*var(--W)/var(--H)));min-width:272px;margin:0 auto;aspect-ratio:var(--W)/var(--H);flex:none;background:#243020;touch-action:manipulation}
#cells{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr)}
.cell{border:1px solid rgba(255,255,255,.07);position:relative}
.cell.wall::after{content:"";position:absolute;inset:8% 8%;background:#5b5f6e;border-radius:30% 40% 30% 40%;box-shadow:inset -4px -5px 0 rgba(0,0,0,.25)}
.cell.lava{background:linear-gradient(135deg,#d2501b,#ffb02e)!important;animation:lava 2s infinite alternate}
@keyframes lava{to{filter:brightness(1.25)}}
.cell.mv{background-image:linear-gradient(rgba(93,169,232,.55),rgba(93,169,232,.55))}
.cell.tg{background-image:linear-gradient(rgba(232,93,93,.6),rgba(232,93,93,.6))}
.cell.tga{background-image:linear-gradient(rgba(111,207,138,.6),rgba(111,207,138,.6))}
.cell.sel{outline:3px solid var(--gold);outline-offset:-3px;z-index:2}
#units{position:absolute;inset:0;pointer-events:none}
.tok{position:absolute;width:calc(100%/var(--W,7));height:calc(100%/var(--H,7));transition:left .28s,top .28s,opacity .5s,transform .2s;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.tok img{height:118%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.tok .glyph{width:74%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;border:3px solid rgba(255,255,255,.85);margin-bottom:4px;box-shadow:0 2px 3px rgba(0,0,0,.5)}
.tok .hpbar{position:absolute;left:12%;right:12%;bottom:1px;height:5px;background:#000a;border-radius:3px;overflow:hidden}
.tok .hpbar i{display:block;height:100%;background:var(--green);transition:width .3s}
.tok.e .hpbar i{background:var(--red)}
.tok.n .hpbar{display:none}
.tok.done{filter:grayscale(.85) brightness(.75)}
.tok.hit{animation:hit .3s}
@keyframes hit{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tok.dead{opacity:0;transform:scale(.6)}
.tok.caged::after{content:"";position:absolute;inset:6%;border:3px solid #8a8f9e;border-radius:6px;background:repeating-linear-gradient(90deg,transparent 0 8px,#8a8f9e99 8px 11px)}
.tok .tag{position:absolute;top:1px;left:2px;font-size:9px;background:#000a;border-radius:4px;padding:0 3px}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;width:calc(100%/var(--W,7));text-align:center;font-weight:900;font-size:20px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 2px 2px #000;animation:pop .95s forwards}
.pop.heal{color:#8dffb0}.pop.txt{font-size:13px;color:var(--gold)}
@keyframes pop{0%{transform:translateY(8px) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-4px) scale(1.1)}100%{transform:translateY(-34px);opacity:0}}
#info{margin:6px 8px 0;padding:6px 10px;background:var(--panel);border-radius:10px;min-height:62px;font-size:12.5px;line-height:1.45;flex:none}
#info b{font-size:14px}
#info .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{background:#0007;border-radius:6px;padding:1px 6px;font-size:11px}
.bar{height:6px;background:#0008;border-radius:3px;overflow:hidden;min-width:70px;flex:1}
.bar i{display:block;height:100%}
#hint{margin:6px 8px 0;padding:6px 10px;background:#3a2f12;border:1px solid var(--gold);border-radius:10px;font-size:12.5px;line-height:1.45;color:#ffe9a8;flex:none}
#menu{margin:6px 8px 0;display:flex;gap:6px;flex-wrap:wrap;flex:none}
#menu button,#endTurn{flex:1;min-width:64px;background:var(--panel2);color:var(--ink);border:2px solid #3b4b8a;border-radius:10px;padding:10px 6px;font:inherit;font-weight:700;font-size:14px}
#menu button:active,#endTurn:active{background:#3b4b8a}
#menu button:disabled{opacity:.4}
#menu .sub{border-color:var(--gold);color:var(--gold)}
#skills{margin:6px 8px 0;max-height:38vh;overflow:auto;display:flex;flex-direction:column;gap:5px;flex:none;-webkit-overflow-scrolling:touch}
#skills button{display:flex;gap:8px;align-items:center;text-align:left;background:var(--panel);color:var(--ink);border:2px solid #3b4b8a;border-radius:10px;padding:7px 9px;font:inherit}
#skills button:disabled{opacity:.4}
#skills .nm{font-weight:900;font-size:14px;min-width:7.5em}
#skills .ds{font-size:11.5px;color:var(--mute);flex:1}
#skills .co{font-size:12px;color:var(--gold);white-space:nowrap}
#endTurn{margin:6px 8px 8px;flex:none;border-color:var(--gold);color:var(--gold)}
.hidden{display:none!important}
#dlg{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:8px 10px 12px;background:linear-gradient(0deg,#0a0e1ce6 70%,transparent)}
#dlg .box{position:relative;background:#1b2347f2;border:2px solid var(--gold);border-radius:14px;padding:10px 12px 14px 12px;min-height:92px;display:flex;gap:10px}
#dlg .por{width:64px;flex:none;display:flex;align-items:flex-end;justify-content:center}
#dlg .por img{max-height:86px;max-width:64px}
#dlg .por .glyph{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#fff;border:3px solid #fff8}
#dlg .tx{flex:1}
#dlg .who{font-weight:900;color:var(--gold);font-size:13px;margin-bottom:2px}
#dlg .t{font-size:15px;line-height:1.6;white-space:pre-wrap}
#dlg .nx{position:absolute;right:12px;bottom:3px;color:var(--gold);animation:bl 1s infinite}
#dlg.narr .box{justify-content:center;text-align:center;font-style:normal}
#dlg.narr .por,#dlg.narr .who{display:none}
@keyframes bl{50%{opacity:.2}}
.screen{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;background:radial-gradient(circle at 50% 30%,#2a3a78,#0b0f1c 70%)}
.screen h1{margin:0;font-size:34px;font-weight:900;letter-spacing:.06em;color:var(--gold);text-shadow:0 3px 0 #6b4a05,0 0 18px #f2c14e88}
.screen h2{margin:0;font-size:22px;color:var(--gold)}
.screen .sub{color:var(--mute);font-size:14px}
.screen .big{background:var(--gold);color:#3a2a00;border:0;border-radius:14px;padding:13px 34px;font:inherit;font-size:18px;font-weight:900;box-shadow:0 4px 0 #8a6410}
.screen .big:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6410}
.screen .copy{font-size:11px;color:#7b86b0;position:absolute;bottom:12px}
.party{display:flex;gap:6px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.party img{height:96px}
.note{font-size:11.5px;color:var(--mute);line-height:1.6;max-width:360px}
.list{font-size:13px;line-height:1.7;background:#0007;border-radius:10px;padding:8px 14px;text-align:left}
.screen .big.sec{background:#2a3560;color:var(--gold);box-shadow:0 4px 0 #141b3a;font-size:15px;padding:9px 26px;border:2px solid var(--gold)}
.icgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:360px}.icb{background:var(--panel);border:2px solid #3a4778;border-radius:14px;padding:6px 4px;color:var(--ink);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}.icb img{width:100%;border-radius:12px}.icb.on{border-color:var(--gold);background:var(--panel2)}
.tracks{display:flex;flex-direction:column;gap:6px;width:100%;max-width:360px}
.trk{display:flex;gap:10px;align-items:center;text-align:left;background:var(--panel);color:var(--ink);border:2px solid #3b4b8a;border-radius:10px;padding:9px 12px;font:inherit}
.trk.on{border-color:var(--gold);background:#3a3550}
.trk .pl{color:var(--gold);font-size:16px;width:1.2em}
.trk .tn{font-weight:900;font-size:14px;line-height:1.35}
.trk small{display:block;font-weight:500;font-size:11.5px;color:var(--mute)}
.pulse{animation:bl 1.4s infinite}
/* ===== 重厚ファンタジーUI ===== */
:root{--bg:#14110d;--panel:#241d14;--panel2:#33291b;--gold:#e3b95a;--gold2:#a47a2a;--ink:#f3ead6;--mute:#b3a483;--red:#d9534f;--blue:#5a9bd0;--green:#7bc47f;--ln:#6e5424}
html,body{background:#070605;font-family:"Shippori Mincho","Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
#app{background:radial-gradient(120% 70% at 50% 0,#2b2216,#120f0a 70%),#120f0a}
#top{background:linear-gradient(180deg,#2d2314,#17120b);border-bottom:2px solid var(--gold2);box-shadow:0 2px 0 #000,0 3px 8px #0009;letter-spacing:.04em}
#stageName{text-shadow:0 1px 0 #000}
.ibtn{background:linear-gradient(180deg,#43341e,#2a2013);border:1px solid var(--gold2);color:var(--gold);border-radius:4px}
#boardWrap{border:3px solid var(--gold2);outline:2px solid #000;box-shadow:0 0 0 5px #2a2013,0 0 0 6px var(--gold2),0 8px 18px #000c;border-radius:2px}
.cell{border:1px solid rgba(0,0,0,.28)}
.cell.mv{background-image:linear-gradient(rgba(70,140,230,.5),rgba(70,140,230,.5));box-shadow:inset 0 0 0 2px rgba(150,200,255,.55)}
.cell.tg{background-image:linear-gradient(rgba(220,60,50,.55),rgba(220,60,50,.55));box-shadow:inset 0 0 0 2px rgba(255,150,130,.6)}
.cell.tga{box-shadow:inset 0 0 0 2px rgba(160,255,180,.6)}
.cell.sel{outline:3px solid var(--gold);animation:selp 1s infinite alternate}
@keyframes selp{to{outline-color:#fff6c8}}
.tok .hpbar{height:6px;background:#000c;border:1px solid #000;border-radius:1px;left:10%;right:10%}
.tok .hpbar i{background:linear-gradient(180deg,#9be59d,#3f9a4a)}
.tok.e .hpbar i{background:linear-gradient(180deg,#f08a80,#b22d27)}
.tok .glyph{border-radius:50% 50% 45% 45%;border:3px solid #e9d7a0}
#info,#hint{border-radius:3px}
#info{background:linear-gradient(180deg,#2e2416,#1b150d);border:2px solid var(--gold2);box-shadow:inset 0 0 0 2px #000,0 2px 6px #0008}
#info b{color:var(--gold);letter-spacing:.05em}
.chip{background:#000a;border:1px solid var(--ln);border-radius:2px;color:var(--mute)}
.bar{border:1px solid #000;border-radius:1px;height:8px;background:#000b}
#hint{background:#2f2410;border:1px solid var(--gold2);color:#f0d594;box-shadow:inset 0 0 0 1px #000}
#menu button,#endTurn{background:linear-gradient(180deg,#44351f,#271e12);border:2px solid var(--gold2);border-radius:3px;color:var(--ink);letter-spacing:.12em;box-shadow:inset 0 1px 0 #ffffff22,0 2px 0 #000}
#menu button:active,#endTurn:active{background:#5a4526;transform:translateY(1px)}
#menu .sub{color:var(--gold);border-color:var(--gold)}
#endTurn{color:var(--gold);border-color:var(--gold)}
#skills button{background:linear-gradient(180deg,#32271a,#1d1710);border:2px solid var(--ln);border-radius:3px}
#skills button:active{border-color:var(--gold)}
#skills .nm{color:var(--gold)}
#dlg{background:linear-gradient(0deg,#050403f0 70%,transparent)}
#dlg .box{background:linear-gradient(180deg,#2a2114f5,#17120bf5);border:2px solid var(--gold2);border-radius:3px;box-shadow:inset 0 0 0 2px #000,0 0 0 1px var(--gold2),0 6px 14px #000c}
#dlg .who{color:var(--gold);letter-spacing:.1em;border-bottom:1px solid var(--ln);display:inline-block;padding-bottom:1px;margin-bottom:4px}
.screen{background:radial-gradient(circle at 50% 28%,#4a3a1e 0,#1a140b 55%,#070605 100%)}
.screen h1{font-family:inherit;letter-spacing:.12em;color:var(--gold);text-shadow:0 2px 0 #4a3208,0 0 22px #e3b95a77}
.screen h2{color:var(--gold);letter-spacing:.1em;border-bottom:1px solid var(--gold2);padding-bottom:6px}
.screen .big{background:linear-gradient(180deg,#f0cb72,#b88a30);color:#2a1d05;border:2px solid #5a4010;border-radius:3px;letter-spacing:.2em;box-shadow:0 3px 0 #4a3208,inset 0 1px 0 #fff6}
.screen .big.sec{background:linear-gradient(180deg,#43341e,#271e12);color:var(--gold);border:2px solid var(--gold2);box-shadow:0 2px 0 #000;letter-spacing:.1em}
.list{background:#000a;border:1px solid var(--ln);border-radius:3px}
.trk{background:linear-gradient(180deg,#32271a,#1d1710);border:2px solid var(--ln);border-radius:3px}
.trk.on{border-color:var(--gold);background:#3d2f19}
.screen::before,.screen::after{content:"";position:absolute;left:14px;right:14px;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.screen::before{top:14px}.screen::after{bottom:38px}
.trk .tn{flex:1}.cmt{margin-top:7px;padding:7px 9px;border-top:1px solid var(--ln);font-weight:500;font-size:12.5px;line-height:1.7;color:var(--ink)}.cmt b{display:block;color:var(--gold);font-size:11px;letter-spacing:.1em;margin-bottom:2px}.screen.scr-scroll{justify-content:flex-start;overflow-y:auto;padding-top:34px;padding-bottom:50px}.grp{width:100%;max-width:360px;text-align:left;margin:8px 0 0;padding-bottom:3px;border-bottom:1px solid var(--gold2);color:var(--gold);font-size:13px;letter-spacing:.1em}.stc{display:flex;align-items:center;gap:12px;width:100%;max-width:360px;margin:7px auto;padding:12px 14px;text-align:left;color:#f3e6bd;font-family:inherit;font-size:16px;font-weight:700;border:1px solid var(--gold2);border-radius:6px;background:linear-gradient(90deg,var(--cc),rgba(20,16,12,.92));cursor:pointer}.stc .no{width:30px;height:30px;line-height:28px;text-align:center;border:1px solid var(--gold);border-radius:50%;color:var(--gold);flex:none}.stc small{display:block;font-size:12px;font-weight:500;color:#cdbf98;margin-top:2px}.stc.lock{opacity:.4;filter:grayscale(.8)}
/* フィールドをリアルに */
#cells{box-shadow:inset 0 0 38px rgba(0,0,0,.55)}
.cell::before{content:"";position:absolute;inset:0;pointer-events:none;background:rgba(0,0,0,0);background-image:linear-gradient(rgba(255,255,255,calc(var(--b) * 1)),rgba(255,255,255,calc(var(--b) * 1)))}
.cell:not(.wall):not(.lava)::after{content:"";position:absolute;pointer-events:none;left:var(--px);top:var(--py);width:34%;height:34%;opacity:.55;transform:rotate(var(--rot))}
.th-grass .cell:not(.wall)::after{width:6%;height:30%;left:var(--px);top:var(--py);background:#7fb35a;box-shadow:5px 3px 0 #6a9e4a,-5px 5px 0 #8bc063,10px 0 0 #5c8a40;border-radius:2px 2px 0 0;transform:none;opacity:.7}
.th-grass .cell{background-image:radial-gradient(circle at 25% 30%,rgba(255,255,255,.07) 0 12%,transparent 13%),radial-gradient(circle at 70% 75%,rgba(0,0,0,.1) 0 15%,transparent 16%)}
.th-stone .cell:not(.wall),.th-plaza .cell:not(.wall){background-image:linear-gradient(135deg,rgba(255,255,255,.08),transparent 40%,rgba(0,0,0,.14))}
.th-stone .cell:not(.wall)::after,.th-plaza .cell:not(.wall)::after{width:40%;height:1px;background:rgba(0,0,0,.4);box-shadow:3px 4px 0 rgba(0,0,0,.25)}
.th-cave .cell:not(.wall){background-image:radial-gradient(circle at 30% 30%,rgba(255,255,255,.06) 0 14%,transparent 15%),radial-gradient(circle at 75% 70%,rgba(0,0,0,.25) 0 18%,transparent 19%)}
.th-cave .cell:not(.wall)::after{width:10%;height:8%;border-radius:50%;background:#2a2622;box-shadow:inset 1px 1px 0 rgba(255,255,255,.12),6px 8px 0 -1px #2a2622}
.th-volc .cell:not(.wall){background-image:radial-gradient(circle at 20% 25%,rgba(255,140,50,.14) 0 10%,transparent 11%),linear-gradient(160deg,rgba(0,0,0,0),rgba(0,0,0,.2))}
.th-volc .cell:not(.wall)::after{width:30%;height:2px;background:linear-gradient(90deg,transparent,rgba(255,110,40,.75),transparent);box-shadow:0 0 6px rgba(255,100,30,.7)}
.cell.wall::after{inset:6% 6%!important;width:auto!important;height:auto!important;opacity:1!important;transform:none!important;left:auto!important;top:auto!important;border-radius:26% 38% 30% 42%;background:radial-gradient(circle at 32% 28%,#9298a8,#5b5f6e 55%,#3a3d48)!important;box-shadow:inset -4px -5px 0 rgba(0,0,0,.3),3px 5px 5px rgba(0,0,0,.55)!important}
.th-cave .cell.wall::after{background:radial-gradient(circle at 32% 28%,#7a6e62,#4d453c 55%,#2c2722)!important}
.th-volc .cell.wall::after{background:radial-gradient(circle at 32% 28%,#6e5448,#44302a 55%,#26181a)!important}
.th-grass .cell.wall::after{background:radial-gradient(circle at 32% 28%,#8c9a86,#5d6a58 55%,#3a4636)!important}
.cell.lava::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,rgba(255,240,150,.55),transparent 45%),radial-gradient(circle at 75% 70%,rgba(255,200,80,.4),transparent 40%);animation:lvp 1.6s infinite alternate;pointer-events:none}
@keyframes lvp{from{opacity:.4}to{opacity:1}}
.tok::before{content:"";position:absolute;left:18%;right:18%;bottom:6%;height:12%;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(2px);z-index:-1}

/* 戦闘演出 */
.fxe{position:absolute;width:calc(100%/var(--W,7));height:calc(100%/var(--H,7));pointer-events:none;z-index:5}
.fxe.slash::before{content:"";position:absolute;left:-10%;top:46%;width:120%;height:8%;background:linear-gradient(90deg,transparent,#fff 45%,#bfe3ff 55%,transparent);box-shadow:0 0 10px #fff;transform:rotate(-38deg) scaleX(0);animation:slsh .3s forwards}
@keyframes slsh{40%{transform:rotate(-38deg) scaleX(1);opacity:1}100%{transform:rotate(-38deg) scaleX(1.1);opacity:0}}
.fxe.impact::before{content:"";position:absolute;inset:10%;border-radius:50%;background:radial-gradient(circle,#fff,#ffd76a 40%,transparent 70%);animation:imp .35s forwards}
@keyframes imp{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
.fxe.burst::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fff 0,#c8a0ff 30%,rgba(120,70,255,.5) 55%,transparent 72%);animation:bst .5s forwards}
.fxe.burst::after{content:"";position:absolute;inset:15%;border:3px solid #e6d0ff;border-radius:50%;animation:ring .5s forwards}
@keyframes bst{from{transform:scale(.3);opacity:1}to{transform:scale(1.5);opacity:0}}
@keyframes ring{from{transform:scale(.3);opacity:1}to{transform:scale(1.7);opacity:0}}
.fxe.heal::before,.fxe.buff::before{content:"";position:absolute;inset:6%;border-radius:50%;animation:ring .6s forwards}
.fxe.heal::before{border:3px solid #8dffb0;box-shadow:0 0 14px #8dffb0,inset 0 0 14px #8dffb0}
.fxe.buff::before{border:3px solid #ffd76a;box-shadow:0 0 14px #ffd76a,inset 0 0 14px #ffd76a}
.fxe .sp{position:absolute;bottom:20%;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:spk .7s forwards}
.fxe.heal .sp{background:#b8ffd0;box-shadow:0 0 6px #6fcf8a}.fxe.buff .sp{background:#ffe9a0;box-shadow:0 0 6px #ffb02e}.fxe.die .sp{background:#ddd;box-shadow:0 0 5px #888}
@keyframes spk{to{transform:translate(var(--dx),-42px);opacity:0}}
.pop.big{font-size:28px;color:#ffe27a}
.shk{animation:shk .3s}.shk2{animation:shk2 .4s}
@keyframes shk{20%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}80%{transform:translate(-2px,1px)}}
@keyframes shk2{15%{transform:translate(-6px,3px)}35%{transform:translate(6px,-4px)}60%{transform:translate(-4px,3px)}85%{transform:translate(3px,-2px)}}
.pop.say{width:auto;left:auto;white-space:nowrap;font-size:14px;z-index:6;animation-name:saypop;background:rgba(20,14,8,.88);border:1px solid var(--gold);border-radius:8px;padding:2px 8px;margin-left:calc(100%/14);color:#fff3cf;animation-duration:1.2s}@keyframes saypop{0%{transform:translate(-50%,6px);opacity:0}12%{transform:translate(-50%,-4px);opacity:1}80%{transform:translate(-50%,-10px);opacity:1}100%{transform:translate(-50%,-18px);opacity:0}}
/* アニマ別エフェクト */
.fxe[class*="e-"]::before,.fxe[class*="e-"]::after{content:"";position:absolute;pointer-events:none}
.fxe.e-fire::before{inset:-5% 10% 5%;border-radius:50% 50% 40% 40%;background:radial-gradient(ellipse at 50% 80%,#fff6b0,#ff9a2e 40%,#e0361a 65%,transparent 75%);animation:flm .6s forwards;filter:blur(.5px)}
@keyframes flm{0%{transform:scale(.3,.2);opacity:1;transform-origin:50% 100%}40%{transform:scale(1,1.3);opacity:1}100%{transform:scale(.8,1.7) translateY(-10px);opacity:0}}
.fxe.e-fire .sp{background:#ffb347;box-shadow:0 0 6px #ff5a1f}
.fxe.e-water::before{inset:8%;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 40% 35%,#e8fbff,#6cc6ff 45%,rgba(40,110,230,.6) 70%,transparent 72%);animation:wtr .55s forwards}
.fxe.e-water::after{inset:15%;border:3px solid #bfe9ff;border-radius:50%;animation:ring .6s .08s forwards}
@keyframes wtr{from{transform:scale(.3) translateY(-20px);opacity:1}60%{transform:scale(1.1);opacity:1}to{transform:scale(1.3);opacity:0}}
.fxe.e-water .sp{background:#aee4ff;box-shadow:0 0 6px #4aa8ff}
.fxe.e-wood::before{inset:5%;background:conic-gradient(from 0deg,transparent 0 10%,#5fbf5a 10% 16%,transparent 16% 35%,#8fdc6a 35% 41%,transparent 41% 60%,#3f9f4a 60% 66%,transparent 66% 85%,#7ad06a 85% 91%,transparent 91%);border-radius:50%;animation:lfs .6s forwards}
@keyframes lfs{from{transform:scale(.3) rotate(0);opacity:1}to{transform:scale(1.4) rotate(120deg);opacity:0}}
.fxe.e-wood .sp{background:#7ad06a;box-shadow:0 0 5px #2f8f3a;border-radius:2px 50% 2px 50%;width:7px;height:5px}
.fxe.e-stone::before{left:30%;top:-30%;width:40%;height:60%;background:linear-gradient(135deg,#b9b2a2,#6b655a);clip-path:polygon(50% 0,100% 40%,80% 100%,20% 100%,0 40%);animation:stn .35s forwards;box-shadow:0 0 0 #000}
@keyframes stn{0%{transform:translateY(-60px);opacity:1}60%{transform:translateY(60px) scale(1);opacity:1}100%{transform:translateY(60px) scale(1.6);opacity:0}}
.fxe.e-stone::after{inset:30% 0 0;border-radius:50%;background:radial-gradient(ellipse,rgba(190,180,160,.85),transparent 65%);animation:dst .5s .2s both}
@keyframes dst{from{transform:scale(.3);opacity:0}30%{opacity:1}to{transform:scale(1.6);opacity:0}}
.fxe.e-stone .sp{background:#a89f8c;box-shadow:none;border-radius:1px}
.fxe.e-beast::before{inset:0;background:linear-gradient(115deg,transparent 18%,#fff 20%,#ffd9a0 24%,transparent 27%,transparent 40%,#fff 42%,#ffd9a0 46%,transparent 49%,transparent 62%,#fff 64%,#ffd9a0 68%,transparent 71%);animation:clw .35s forwards;filter:drop-shadow(0 0 4px #ff8a3c)}
@keyframes clw{from{clip-path:inset(0 100% 0 0);opacity:1}60%{clip-path:inset(0 0 0 0);opacity:1}to{clip-path:inset(0 0 0 0);opacity:0}}
.fxe.e-sound::before,.fxe.e-sound::after{inset:20%;border:3px solid #ffb6e6;border-radius:50%;box-shadow:0 0 8px #ff8fd6;animation:ring .55s forwards}
.fxe.e-sound::after{animation-delay:.12s;border-color:#a8e0ff;box-shadow:0 0 8px #6cc6ff}
.fxe.e-sound .sp{background:none;box-shadow:none;width:auto;height:auto;font-size:12px;color:#ffd1f1;text-shadow:0 0 5px #ff8fd6;border-radius:0}
.fxe.e-sound .sp::before{content:"♪"}
.fxe.e-star::before{inset:5%;background:radial-gradient(circle,#fff,#fff6b0 20%,transparent 50%),conic-gradient(from 0deg,transparent 0 6%,#fff 6% 8%,transparent 8% 25%,#fff 25% 27%,transparent 27% 50%,#fff 50% 52%,transparent 52% 75%,#fff 75% 77%,transparent 77%);border-radius:50%;animation:str .6s forwards}
@keyframes str{from{transform:scale(.2) rotate(0);opacity:1}to{transform:scale(1.5) rotate(90deg);opacity:0}}
.fxe.e-star .sp{background:#fff8c8;box-shadow:0 0 8px #ffe27a}

/* ===== PC版UI(幅900px以上)。スマホ版は上のスタイルのまま ===== */
#side{display:contents}
@media (min-width:900px){
  html,body{background:radial-gradient(circle at 50% 30%,#2a2013,#0a0806 70%)}
  #app{max-width:1240px;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh;min-height:640px;border-left:2px solid var(--gold2);border-right:2px solid var(--gold2);box-shadow:0 0 60px #000a}
  #top{grid-column:1/3;padding:10px 22px;font-size:16px}
  #stageName{font-size:20px;letter-spacing:.1em}
  .ibtn{font-size:15px;padding:7px 14px;cursor:pointer}
  #boardWrap{grid-column:1;grid-row:2;width:min(calc(100% - 40px),calc((100dvh - 110px)*var(--W)/var(--H)));min-width:0;margin:auto;align-self:center;border:3px solid var(--gold2);box-shadow:0 0 0 2px #000,0 10px 30px #000c}
  .cell{cursor:pointer}.cell:hover{filter:brightness(1.18)}
  #side{display:flex;flex-direction:column;grid-column:2;grid-row:2;padding:18px 20px 18px 6px;gap:10px;overflow-y:auto;min-height:0}
  #info,#hint,#menu,#skills,#endTurn{margin:0!important}
  #info{font-size:15px;min-height:96px;padding:12px 16px}#info b{font-size:19px}
  #hint{font-size:14px;padding:10px 14px}
  #menu{gap:8px}#menu button,#endTurn{font-size:16px;padding:13px 8px;cursor:pointer}
  #menu button:hover,#endTurn:hover{background:#5a4526}
  #skills{max-height:none;flex:1 1 auto;min-height:0}
  #skills button{padding:10px 12px;cursor:pointer}#skills button:hover:not(:disabled){border-color:var(--gold)}
  #skills .nm{font-size:16px}#skills .ds{font-size:13px}#skills .co{font-size:14px}
  #endTurn{margin-top:auto!important}
  .pop{font-size:26px}.pop.txt{font-size:17px}.pop.big{font-size:38px}.pop.say{font-size:18px}
  .tok .glyph{font-size:28px}
  #dlg{left:50%;right:auto;width:min(860px,94%);transform:translateX(-50%);padding:10px 0 22px;background:none}
  #dlg .box{min-height:130px;padding:16px 22px 20px;gap:18px}
  #dlg .por{width:110px}#dlg .por img{max-height:130px;max-width:110px}
  #dlg .who{font-size:16px}#dlg .t{font-size:19px;line-height:1.7}
  .screen h1{font-size:68px}.screen h2{font-size:34px}.screen .sub{font-size:18px}
  .screen .big{font-size:22px;padding:15px 60px;cursor:pointer}.screen .big.sec{font-size:18px;padding:11px 44px}
  .screen .party img{height:190px!important}.screen .note{font-size:14px}
  .tracks,.grp,.stc{max-width:560px!important}.trk,.stc{cursor:pointer}
  .trk:hover,.stc:hover:not(.lock){filter:brightness(1.2)}
  .screen.scr-scroll{padding-top:50px}
}
.how{width:100%;max-width:420px;text-align:left;font-size:13.5px;line-height:1.65;overflow:auto;max-height:62dvh}.how p{margin:0 0 10px}.how b{color:var(--gold)}
#pause{z-index:60}#pause.hidden{display:none}
@media (min-width:900px){.how{font-size:16px;max-width:620px}}
#cells{z-index:0}#units{z-index:1}#fx{z-index:2}
</style>
</head>
<body>
<div id="app">
  <div id="top"><span id="stageName">戦略のメガリス</span><span id="turnInfo"></span><button class="ibtn" id="bgmBtn">♪ON</button><button class="ibtn" id="pauseBtn">⏸</button></div>
  <div id="boardWrap"><div id="cells"></div><div id="units"></div><div id="fx"></div></div>

</div>

<script>
"use strict";
let W=7,H=7;
function applySize(){const b=$('#boardWrap');b.style.setProperty('--W',W);b.style.setProperty('--H',H);$('#cells').style.gridTemplateColumns=`repeat(${W},1fr)`;$('#cells').style.gridTemplateRows=`repeat(${H},1fr)`}
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const dist=(a,b)=>Math.abs(a.x-b.x)+Math.abs(a.y-b.y);

/* ---------- BGM ---------- */
let bgmOn=true,curBgm=null,audios={},fadeTimers=[];
function getAudio(k){if(!audios[k]){const a=new Audio(BGM[k]);a.loop=true;a.preload='auto';a.volume=0;audios[k]=a}return audios[k]}
function fade(a,to,ms,done){clearInterval(a._iv);const from=a.volume,t0=performance.now();a._iv=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/ms);a.volume=Math.max(0,Math.min(1,from+(to-from)*p));if(p>=1){clearInterval(a._iv);done&&done()}},40)}
/* エリアごとのBGMランダム(ファイルが無い曲は候補から外れる)。救出戦は固定 */
function pickBgm(v){
  if(!Array.isArray(v))return v;
  const pool=v.filter(k=>TRACKS.some(t=>t.k===k));
  return pool.length?pool[Math.floor(Math.random()*pool.length)]:v[0];
}
const VOLC_BGM=['volcano','volcano2'];
const TRACKS=[
 {k:'title',n:'新緑の進軍、鋼の戦意',u:'タイトル',c:'『弾幕のメガリス』のタイトル曲をアレンジした一曲です。\n続編のタイトル曲として、新しい曲を作ろうかと悩みました。\nけれど、シリーズの原点となる曲なので、あらためて採用しました。',g:'メガリスシリーズのアレンジ'},
 {k:'volcano',n:'戦況を照らす焔',u:'火山',g:'メガリスシリーズのアレンジ'},

 {k:'rebel',n:'砕けぬための行軍',u:'反乱軍との戦闘',c:'『弾幕のメガリス』の中盤で流れていた曲です。\nシリーズの中でも、1、2を争うくらい気に入っている曲なので、\nたくさん聴いてほしくて、反乱軍との戦闘曲に選びました。\n既存の曲を、このゲーム用にアレンジしています。',g:'メガリスシリーズのアレンジ'},
 {k:'water',n:'野望を掲げて',u:'水辺・氷河',c:'『弾幕のメガリス』の最序盤のボスの曲をアレンジしたものです。\n水辺や氷河のマップで流れる曲として使っていますが、\nあまり氷河っぽくないかもしれません。ごめんなさい。',g:'メガリスシリーズのアレンジ'},
 {k:'forest',n:'バウムゲフェヒト〜Sylvan Dominion',u:'森林・樹海',c:'こちらも、1、2を争うくらい大好きな曲です！\n森林や樹海のマップで流れる曲として使っています。\nぜひじっくり聴いてください。\n既存の曲を、このゲーム用にアレンジしています。',g:'メガリスシリーズのアレンジ'},
 {k:'tutorial',n:'ボン&ジニー',u:'チュートリアル',c:'ほかのゲームで使っていた曲です。\nジニーちゃんのイメージに合う、可愛い曲だと思ったので、\nチュートリアルの曲として採用しました。\n既存の曲を、このゲーム用にアレンジしています。',g:'ボンシリーズのアレンジ'},
 {k:'rescue',n:'ボンボンミリタリー！',u:'ボンの救出戦',c:'『ボンボンライフ！』のBGMです。\n7人のボンたちと言えば、この曲ですよね。\n原曲は可愛い雰囲気でしたが、アレンジしたら急に勇ましくなりました。\nボンを救出する戦いの曲にしました。',g:'ボンシリーズのアレンジ'},
 {k:'cave',n:'ちいさな迷子 - T Arrange',u:'洞窟',g:'ボンシリーズのアレンジ'},

];
let seen=new Set();try{seen=new Set(JSON.parse(localStorage.getItem('tact_seen')||'[]'))}catch(e){}
function markSeen(k){if(seen.has(k))return;seen.add(k);try{localStorage.setItem('tact_seen',JSON.stringify([...seen]))}catch(e){}}
function playBgm(k,gal){
  if(k&&!gal)markSeen(k);
  if(k&&curBgm===k&&audios[k]&&!audios[k].paused)return;
  /* いま鳴っている曲は、選んだ曲以外ぜんぶ止める(2重再生防止) */
  Object.keys(audios).forEach(n=>{if(n===k)return;const o=audios[n];if(!o.paused)fade(o,0,400,()=>{try{o.pause()}catch(e){}})});
  curBgm=k;
  if(!k||!bgmOn)return;
  try{const a=getAudio(k);clearInterval(a._iv);if(a.paused)a.currentTime=0;a.volume=0;const p=a.play();if(p&&p.catch)p.catch(()=>{});fade(a,.55,800)}catch(e){}
}
$('#bgmBtn').onclick=()=>{

      $('#dlg .t').textContent=txt;
      const por=$('#dlg .por');por.innerHTML='';
      const p=PORT[who];

      else if(p){const d=document.createElement('div');d.className='glyph';d.style.background=p.c;d.textContent=p.g;por.appendChild(d)}
    };
    dlg.onclick=show;show();

}

function sfx(k){
  if(typeof bgmOn!=='undefined'&&!bgmOn)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime,out=AC.createGain();out.gain.value=.5;out.connect(AC.destination);
    const tone=(f0,f1,d,type,v,delay=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t+delay);o.frequency.exponentialRampToValueAtTime(f1,t+delay+d);g.gain.setValueAtTime(v,t+delay);g.gain.exponentialRampToValueAtTime(.001,t+delay+d);o.connect(g);g.connect(out);o.start(t+delay);o.stop(t+delay+d+.02)};
    const noise=(d,v,fc)=>{const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=fc;const g=AC.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(out);s.start(t)};
    if(k==='slash'){noise(.16,.9,3200);tone(520,120,.14,'sawtooth',.18)}
    else if(k==='hit'){noise(.12,.8,900);tone(160,50,.14,'square',.3)}
    else if(k==='magic'){tone(300,1200,.28,'sine',.25);tone(450,1800,.28,'triangle',.12,.03);noise(.2,.25,5000)}
    else if(k==='heal'){[523,659,784,1047].forEach((f,i)=>tone(f,f,.22,'sine',.18,i*.08))}
    else if(k==='buff'){tone(400,800,.2,'triangle',.2);tone(600,1200,.25,'triangle',.15,.1)}
    else if(k==='fire'){noise(.35,.7,700);tone(200,90,.3,'sawtooth',.22);tone(500,260,.25,'square',.08,.04)}
    else if(k==='water'){tone(900,350,.18,'sine',.25);tone(700,300,.2,'sine',.18,.08);noise(.2,.3,2500)}
    else if(k==='wood'){tone(330,220,.2,'triangle',.22);noise(.22,.45,1800);tone(440,330,.15,'triangle',.12,.1)}
    else if(k==='stone'){noise(.18,.9,500);tone(120,45,.22,'square',.32);tone(90,40,.2,'square',.2,.1)}
    else if(k==='beast'){noise(.12,.8,2600);tone(700,150,.14,'sawtooth',.2);tone(650,130,.14,'sawtooth',.2,.1)}
    else if(k==='sound'){[0,.09,.18].forEach((d,i)=>tone(660+i*110,660+i*110,.2,'sine',.2,d));noise(.15,.2,4000)}
    else if(k==='star'){[1318,1568,2093].forEach((f,i)=>tone(f,f*1.01,.25,'sine',.14,i*.07))}
    else if(k==='kill'){tone(220,40,.45,'sawtooth',.28);noise(.3,.6,500)}
  }catch(e){}
}

/* ---------- Pathing ---------- */
function reach(u){
  const res=new Map();const q=[[u.x,u.y,0]];res.set(u.x+','+u.y,0);
  while(q.length){
    const [x,y,d]=q.shift();if(d>=u.mov+(u.buf&&u.buf.spd?1:0))continue;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H||blocked(nx,ny))continue;
      const k=nx+','+ny;if(res.has(k))continue;
      const o=unitAt(nx,ny);
      if(o&&o!==u&&(o.team==='e')!==(u.team==='e'))continue; // enemies block
      res.set(k,d+1);q.push([nx,ny,d+1]);
    }
  }
  const out=[];
  res.forEach((d,k)=>{const [x,y]=k.split(',').map(Number);const o=unitAt(x,y);if(!o||o===u)out.push({x,y,d})});
  return out;
}

/* ---------- Combat ---------- */
function calc(att,def,pow,type,ign=0){
  let dmg=Math.round(pow*atkPow(att,type)-defPow(def)*.6*(1-ign))+(Math.random()*3|0)-1;
  if(def.buf&&def.buf.guard)dmg=Math.round(dmg*def.buf.guard.m);
  return Math.max(1,dmg);
}
async function hurt(att,tgt,pow,type,hits=1,el,ign=0,noC=false){
  if(att.team!==tgt.team){const cv=G.units.find(o=>o!==tgt&&alive(o)&&!o.caged&&o.team===tgt.team&&o.buf.cover&&dist(o,tgt)<=1);if(cv){tgt=cv;pop(cv.x,cv.y,'かばう','txt');await sleep(250)}}
  for(let i=0;i<hits&&alive(tgt);i++){
    const hc=(att.buf.acc?att.buf.acc.m:1)*(tgt.buf.eva?tgt.buf.eva.m:1);
    if(Math.random()>hc){lunge(att,tgt);await sleep(90);pop(tgt.x,tgt.y,'ミス','txt');await sleep(300);continue}
    if(tgt.buf.sleep)delete tgt.buf.sleep;
    const d=calc(att,tgt,pow,type,ign);tgt.hp=Math.max(0,tgt.hp-d);gainExp(att,1);if(tgt.hp<=0)gainExp(att,3)
    const big=d>=14,dead=tgt.hp<=0;
    lunge(att,tgt);await sleep(90);
    const ek=EL_FX[el];
    if(ek){sfx(ek);fxAt('e-'+ek,tgt.x,tgt.y)}else{sfx(type==='mag'?'magic':(big?'hit':'slash'));fxAt(type==='mag'?'burst':(big?'impact':'slash'),tgt.x,tgt.y)}
    flash(tgt);pop(tgt.x,tgt.y,d,big?'big':'');if(big||dead)shake(dead?2:1);placeTok(tgt);await sleep(hits>1?260:350);
    if(tgt.buf.counter&&!noC&&alive(tgt)&&alive(att)&&dist(att,tgt)<=1){pop(tgt.x,tgt.y,'反撃','txt');await sleep(200);await hurt(tgt,att,.8,'phys',1,undefined,0,true)}
  }
  if(!alive(tgt)){sfx('kill');fxAt('die',tgt.x,tgt.y);placeTok(tgt);await sleep(350)}
}

  }

}

function targetsFor(u,sk){ // list of units valid for skill/basic
  const r=sk.r;
  if(sk.t==='revive')return G.units.filter(o=>o.hp<=0&&o.team==='p'&&!o.caged&&dist(u,o)<=r);
  const isFoe=(sk.tg||'enemy').startsWith('enemy');
  return G.units.filter(o=>alive(o)&&!o.caged&&(isFoe?o.team==='e':o.team==='p')&&dist(u,o)<=r);
}

async function useSkill(u,sk,target){
  u.wp-=sk.c;
  const isAll=sk.tg.endsWith('All');
  let tg=isAll?targetsFor(u,sk):[target];
  if(sk.shape&&target){const foes=G.units.filter(o=>alive(o)&&o.team==='e'&&!o.caged&&o!==target);
    if(sk.shape==='cross')tg=[target,...foes.filter(o=>dist(o,target)<=1)];
    else{const ax=Math.abs(target.x-u.x)>=Math.abs(target.y-u.y),dx=Math.sign(target.x-u.x),dy=Math.sign(target.y-u.y);
      tg=[target,...foes.filter(o=>ax?(o.y===target.y&&Math.sign(o.x-target.x)===dx&&Math.abs(o.x-target.x)<=2):(o.x===target.x&&Math.sign(o.y-target.y)===dy&&Math.abs(o.y-target.y)<=2))]}}
  if(sk.t!=='phys'&&sk.t!=='mag')gainExp(u,1);
  pop(u.x,u.y,sk.n,'txt');
  if(u.team==='p'&&SKILL_SAY[sk.n]){await sleep(250);pop(u.x,u.y-.6,'「'+SKILL_SAY[sk.n]+'」','say');await sleep(850)}else await sleep(450);
  if(sk.t==='phys'||sk.t==='mag'){
    for(const t of tg){await hurt(u,t,sk.pow,sk.t,sk.hits||1,sk.el,sk.ign||0);
      if(sk.deb&&alive(t)){t.buf[sk.deb.stat]={m:sk.deb.m,t:3};pop(t.x,t.y,(STAT_LBL[sk.deb.stat]||'')+'↓','txt')}
      if(sk.st&&alive(t)){t.buf[sk.st.k]={m:1,t:sk.st.t||2,v:DOT_KEYS.includes(sk.st.k)?Math.max(3,Math.round(u.mat*.4)):0};pop(t.x,t.y,STAT_LBL[sk.st.k],'txt')}}
  }else if(sk.t==='heal'){
    for(const t of tg){const v=Math.round(u.mat*eff(u,'atk')*sk.k+sk.add);const real=Math.min(v,t.maxhp-t.hp);t.hp+=real;{const ek=EL_FX[sk.el];if(ek){sfx(ek==='water'?'heal':ek);fxAt('e-'+ek,t.x,t.y)}else{sfx('heal');fxAt('heal',t.x,t.y)}}pop(t.x,t.y,'+'+real,'heal');placeTok(t);if(sk.regen){t.buf.regen={m:1,t:3,v:Math.max(3,Math.round(u.mat*.25))};pop(t.x,t.y-.4,'リジェネ','txt')}}
    await sleep(450);
  }else if(sk.t==='revive'){
    for(const t of tg){t.hp=Math.max(1,Math.round(t.maxhp*.3));t.buf={};t.done=false;sfx('heal');fxAt('heal',t.x,t.y);pop(t.x,t.y,'復活！','heal');placeTok(t)}
    await sleep(500);
  }else if(sk.t==='cure'){
    for(const t of tg){for(const k of ['sleep','bind','freeze','burn','poison','bleed'])delete t.buf[k];sfx('heal');fxAt('heal',t.x,t.y);pop(t.x,t.y,'状態回復','heal')}
    await sleep(450);
  }else if(sk.t==='buff'){
    for(const t of tg){{const ek=EL_FX[sk.el];if(ek){sfx(ek);fxAt('e-'+ek,t.x,t.y)}else{sfx('buff');fxAt('buff',t.x,t.y)}}
      if(sk.stat==='both'){t.buf.atk={m:sk.m,t:3};t.buf.def={m:sk.m,t:3};pop(t.x,t.y,'全↑','txt')}
      else{t.buf[sk.stat]={m:sk.m,t:3};pop(t.x,t.y,(STAT_LBL[sk.stat]||'')+(NOARROW.includes(sk.stat)?'':'↑'),'txt')}
      if(sk.regen){t.buf.regen={m:1,t:3,v:Math.max(3,Math.round(u.mat*.25))};pop(t.x,t.y,'リジェネ','txt')}
    }
    await sleep(450);
  }
  placeTok(u);
}

  if(!G.tutorial){setHint(null);return}
  const m={0:'まず、ジニーをタップしてみよう。',1:'青いマスをタップすると移動できるよ。その場で行動するなら、ジニー自身のマスをタップ。',2:'「こうげき」は杖の打撃、「わざ」はアニマの術。敵が近いときに選ぼう。',3:'対象をタップして実行！ 敵は赤いマスで光るよ。',4:'行動が終わったらターン終了。WPは毎ターン2回復するよ。ウィルとリッチはNPC(操作しない)。'};
  setHint('【チュートリアル】'+m[tut]);
}
function clearSel(){sel=null;mode='idle';pendingSkill=null;hl('',[]);setMenu([]);hideSkills();$('#endTurn').classList.remove('hidden')}
function selectUnit(u){
  sel=u;prevPos={x:u.x,y:u.y};mode='move';
  const r=reach(u);hl('mv',r.map(c=>[c.x,c.y]).concat([[u.x,u.y,'sel']]));
  setInfo(u);setMenu([{t:'キャンセル',cls:'sub',f:()=>{clearSel();setInfo(null)}}]);
  if(G.tutorial&&tut<1){tut=1;refreshHint()}
}
async function moveTo(x,y){
  busy=true;sel.x=x;sel.y=y;placeTok(sel);hl('',[]);await sleep(320);busy=false;
  mode='menu';openActionMenu();
  if(G.tutorial&&tut<2){tut=2;refreshHint()}
}
function adjacentCaged(u){return G.units.find(o=>o.caged&&alive(o)&&dist(u,o)===1)}
function openActionMenu(){
  const u=sel;hideSkills();hl('',[[u.x,u.y,'sel']]);
  const b=[
    {t:'こうげき',f:()=>pickSkill(u,{...u.basic,tg:'enemy',c:0,n:u.basic.n,r:u.basic.r,t:u.basic.t,pow:u.basic.pow,basic:true})},
    {t:'わざ',f:()=>{mode='skills';showSkills(u);setMenu([{t:'もどる',cls:'sub',f:openActionMenu}])}},
  ];
  const cg=adjacentCaged(u);
  if(cg)b.push({t:'たすける',cls:'sub',f:()=>rescue(u,cg)});
  b.push({t:'まつ',f:()=>{pdone(u);afterAct()}});
  b.push({t:'移動やりなおし',cls:'sub',f:()=>{u.x=prevPos.x;u.y=prevPos.y;placeTok(u);selectUnit(u)}});
  setMenu(b);setInfo(u);
}
function pickSkill(u,sk){
  hideSkills();
  const targets=targetsFor(u,sk);
  if(sk.tg.endsWith('All')){
    if(!targets.length)return;
    return execSkill(u,sk,null);
  }
  pendingSkill=sk;mode='target';
  hl('',targets.map(t=>[t.x,t.y,sk.tg==='enemy'?'tg':'tga']));
  if(!targets.length){pop(u.x,u.y,'対象なし','txt')}
  setMenu([{t:'やめる',cls:'sub',f:openActionMenu}]);
  if(G.tutorial&&tut<3){tut=3;refreshHint()}
}
async function execSkill(u,sk,target){
  busy=true;hl('',[]);setMenu([]);
  if(sk.basic){pop(u.x,u.y,sk.n,'txt');await sleep(350);await hurt(u,target,sk.pow,sk.t)}
  else await useSkill(u,sk,target);
  busy=false;pdone(u);setInfo(null);
  if(G.tutorial&&tut<4){tut=4;refreshHint()}
  afterAct();
}
async function rescue(u,cg){
  busy=true;setMenu([]);hl('',[]);
  pop(cg.x,cg.y,'救出！','txt');await sleep(500);
  cg.caged=false;cg.team='p';cg.hp=Math.round(cg.maxhp*.7);cg.done=true;placeTok(cg);
  joined[cg.id]=true;
  await say(cg.join||[]);
  busy=false;pdone(u);setInfo(null);afterAct();
}
function afterAct(){
  sel=null;mode='idle';pendingSkill=null;hl('',[]);hideSkills();setMenu([]);
  if(checkEnd())return;
  if(G.units.filter(u=>u.team==='p'&&alive(u)&&!u.done).length===0)setTimeout(endPlayerTurn,350);
}
$('#endTurn').onclick=()=>{if(busy||!G||G.over||G.enemyTurn)return;clearSel();setInfo(null);endPlayerTurn()};

$('#boardWrap').addEventListener('click',e=>{
  if(!G||G.over||busy||G.enemyTurn||!G.active)return;
  const r=$('#boardWrap').getBoundingClientRect();
  const x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);
  if(x<0||y<0||x>=W||y>=H)return;
  const o=unitAt(x,y);
  if(mode==='target'){
    const o2=(pendingSkill&&pendingSkill.t==='revive')?G.units.find(q=>q.hp<=0&&q.team==='p'&&q.x===x&&q.y===y):o;
    const ok=pendingSkill&&o2&&targetsFor(sel,pendingSkill).includes(o2);
    if(ok){return execSkill(sel,pendingSkill,o2)}
    return;
  }
  if(mode==='move'){
    const rc=reach(sel);
    if(rc.some(c=>c.x===x&&c.y===y))return moveTo(x,y);
    if(o&&o!==sel){setInfo(o);return}
    clearSel();setInfo(null);return;
  }
  if(mode==='menu'||mode==='skills'){if(o)setInfo(o);return}
  // idle
  if(o){
    setInfo(o);
    if(o.team==='p'&&!o.done&&!o.caged)selectUnit(o);
  }else setInfo(null);
});

/* ---------- Enemy turn ---------- */
async function endPlayerTurn(){
  G.enemyTurn=true;G.active=false;busy=true;
  $('#endTurn').classList.add('hidden');setHint(null);setMenu([]);
  $('#turnInfo').textContent='敵のターン';
  await statusTick('e');if(checkEnd())return;
  await sleep(500);
  for(const e of G.units.filter(u=>u.team==='e'&&alive(u))){
    if(G.over)return;
    if(e.buf.sleep||e.buf.bind||e.buf.freeze){pop(e.x,e.y,e.buf.sleep?'ZZZ…':(e.buf.freeze?'凍結':'動けない'),'txt');await sleep(450);continue}
    const targets=G.units.filter(u=>u.team==='p'&&alive(u));
    if(!targets.length)break;
    const rc=reach(e);
    if(e.type==='medic'){
      const hurtAl=G.units.filter(a=>a.team==='e'&&alive(a)&&a!==e&&a.hp<a.maxhp);
      let hb=null;
      for(const c of rc){for(const a of hurtAl){if(Math.abs(c.x-a.x)+Math.abs(c.y-a.y)<=2){const sc=(a.maxhp-a.hp)-c.d*.1;if(!hb||sc>hb.sc)hb={c,a,sc}}}}
      if(hb){
        if(hb.c.x!==e.x||hb.c.y!==e.y){e.x=hb.c.x;e.y=hb.c.y;placeTok(e);await sleep(380)}
        pop(e.x,e.y,'癒しの祈り','txt');await sleep(350);
        const real=Math.min(10,hb.a.maxhp-hb.a.hp);hb.a.hp+=real;sfx('heal');fxAt('heal',hb.a.x,hb.a.y);pop(hb.a.x,hb.a.y,'+'+real,'heal');placeTok(hb.a);await sleep(500);
        if(checkEnd())return;await sleep(150);continue;
      }
    }
    let best=null;
    for(const c of rc){for(const t of targets){
      const d=Math.abs(c.x-t.x)+Math.abs(c.y-t.y);
      if(d<=e.range){
        const sc=(e.range>1?d*10:0)-c.d+(t.hp<t.maxhp?2:0)-t.hp/(e.type==='scout'?8:100);
        if(!best||sc>best.sc)best={c,t,sc};
      }
    }}
    if(best){
      if(best.c.x!==e.x||best.c.y!==e.y){e.x=best.c.x;e.y=best.c.y;placeTok(e);await sleep(380)}
      await hurt(e,best.t,1.0,'phys');
    }else{
      let near=targets.reduce((a,b)=>dist(e,a)<=dist(e,b)?a:b);
      const dd=c=>Math.abs(c.x-near.x)+Math.abs(c.y-near.y);
      let bc=e.range>1?rc.reduce((a,b)=>(Math.abs(dd(a)-e.range)<Math.abs(dd(b)-e.range)||(Math.abs(dd(a)-e.range)===Math.abs(dd(b)-e.range)&&a.d<=b.d))?a:b):rc.reduce((a,b)=>dd(a)<=dd(b)?a:b);
      if(bc.x!==e.x||bc.y!==e.y){e.x=bc.x;e.y=bc.y;placeTok(e);await sleep(380)}
    }
    if(checkEnd())return;
    await sleep(150);
  }
  // new player turn
  G.turn++;G.enemyTurn=false;G.active=true;busy=false;
  await statusTick('p');if(checkEnd())return;
  G.units.filter(u=>u.team==='p'&&alive(u)&&!u.caged).forEach(u=>{u.done=false;u.wp=Math.min(u.maxwp,u.wp+2);placeTok(u)});
  $('#turnInfo').textContent='ターン'+G.turn+' 味方';$('#endTurn').classList.remove('hidden');
  if(G.tutorial){tut=0;refreshHint()}
  setInfo(null);
}
function checkEnd(){
  if(G.over)return true;
  if(!alive(G.ginny)){G.over=true;G.resolve('lose');return true}
  if(!G.units.some(u=>u.team==='e'&&alive(u))){G.over=true;G.resolve('win');return true}
  return false;
}

function runBattle(def){
  return new Promise(async resolve=>{
    tokens={};$('#units').innerHTML='';$('#fx').innerHTML='';
    busy=false;mode='idle';sel=null;pendingSkill=null;
    H=def.map.length;W=def.map[0].length;applySize();
    ENEMY_LV=def.lv||0;
    G={map:def.map,theme:def.theme,units:def.units(),turn:1,over:false,enemyTurn:false,active:false,tutorial:!!def.tutorial,resolve};
    G.ginny=G.units.find(u=>u.id==='ginny');
    $('#stageName').textContent=def.name;$('#turnInfo').textContent='ターン1 味方';
    $('#endTurn').classList.remove('hidden');
    buildCells();renderUnits();hl('',[]);setMenu([]);hideSkills();setInfo(null);
    playBgm(pickBgm(def.bgm));
    if(def.tutorial){tut=0;refreshHint()}else setHint(def.hint||null);
    if(def.intro)await say(def.intro);
    G.active=true;
  });
}

async function fight(def,after){
  const snap=gExp,snapA=JSON.stringify(AL);
  for(;;){
    const r=await runBattle(def);
    if(r==='win')break;
    gExp=snap;const o=JSON.parse(snapA);Object.keys(AL).forEach(k=>{AL[k].exp=o[k].exp;AL[k].n=o[k].n});
    await gameOver();
  }
  gExp+=3;
  const got=[];
  while(gLearned<10&&gExp>=G_THR[gLearned-3]){got.push(['ジニー',G_ORDER[gLearned]]);gLearned++}
  const nm={oko:'おこボン',niko:'にこボン',hyoe:'ひょえボン'};
  for(const k of Object.keys(AL)){
    if(!joined[k])continue;
    AL[k].exp+=3;
    while(AL[k].n<10&&AL[k].exp>=ALLY_THR[AL[k].n-3]){got.push([nm[k],ALLY_ORDER[k][AL[k].n]]);AL[k].n++}
  }
  if(got.length)await say(got.map(([w,n])=>['',w+'は「'+n+'」を覚えた！\n(戦いで経験を積んだ)']));
}

    name:'チュートリアル',bgm:'tutorial',map:mapRows.tutorial,theme:TH_GRASS,tutorial:true,
    units:()=>{const g=mkGinny(true);g.x=2;g.y=4;
      const w={id:'will',name:'ウィル',team:'n',npc:true,glyph:'ウ',color:'#6a7fb8',hp:99,maxhp:99,wp:0,maxwp:0,atk:0,mat:0,def:0,mov:0,x:1,y:5,buf:{},skills:[]};
      const r={id:'rich',name:'リッチ',team:'n',npc:true,glyph:'リ',color:'#b8876a',hp:99,maxhp:99,wp:0,maxwp:0,atk:0,mat:0,def:0,mov:0,x:3,y:5,buf:{},skills:[]};
      return [g,w,r,mkEnemy('e1','grunt',1,0),mkEnemy('e2','grunt',3,0)]},
    intro:[
      ['ウィル','ジニー、反乱軍が近づいておるぞ。ここで戦い方を確かめておこうかの。'],
      ['リッチ','ヴァージニア、心配すんな。アニマが繋がってる……力は貸してやる。'],
      ['ジニー','うん、やってみる！'],
    ]
  });
  setHint(null);
  await say([
    ['反乱軍','そこまでだ！ ウィリアム・ナイツ、リチャード・ナイツ、おとなしくついてこい！'],
    ['ジニー','おじいちゃん！ パパ！'],
    ['反乱軍','王家に助けを求めたら、お前の母も捕えるぞ。……忘れるな。'],
  ]);
  for(const id of ['will','rich']){const u=G.units.find(x=>x.id===id);u.hp=0;placeTok(u)}
  await sleep(600);
  await say([
    ['','シンパシーでつながっていたアニマの力が、すうっと遠のいていく。'],
    ['','ジニーは、ひとりで旅に出ることになった。'],
    ['','そのころ、ボン界から文化を見に来た7人のボンたちは、アニマの影響でバラバラになり、各地で反乱軍に捕まっていた。'],
    ['','最初の手がかりは、火山の麓の砦。'],
  ]);
  }
  /* stage 1a */
  if(from<=1){setProg(1);
  await fight({
    name:'第1章 火山の麓・砦の門',bgm:VOLC_BGM,map:mapRows.s1a,theme:TH_VOLC,hint:'ここからは、ジニーひとり。わざで敵を倒し、いやしの水で自分を回復しながら進もう。',
    units:()=>{const g=mkGinny(false);g.x=3;g.y=6;return [g,mkEnemy('e1','grunt',1,1),mkEnemy('e2','grunt',5,1),mkEnemy('e3','archer',3,0)]},
    intro:[['ジニー','砦はこの先……。いこう！']]
  });
  await say([['ジニー','やった……！ 砦の奥へ進もう。'],['','(ジニーは息をととのえ、WPとHPを回復した)']]);
  }
  /* stage 1c */
  if(from<=2){setProg(2);
  await fight({
    name:'第1章 火山の麓・溶岩の道',bgm:VOLC_BGM,map:mapRows.s1c,theme:TH_VOLC,hint:'赤く光るマスは溶岩。通れないけど、敵の矢は飛んでくる。疾兵は足が速いので気をつけて。',
    units:()=>{const g=mkGinny(false);g.x=3;g.y=6;return [g,mkEnemy('e1','grunt',1,1),mkEnemy('e2','scout',5,1),mkEnemy('e3','archer',3,0),mkEnemy('e4','grunt',3,2)]},
    intro:[['ジニー','道の両側が溶岩だ……足元に気をつけて進もう。']]
  });
  await say([['ジニー','ふう……。砦の見張り台が見えてきた。'],['','(ジニーは息をととのえ、WPとHPを回復した)']]);
  }
  /* stage 1d */
  if(from<=3){setProg(3);
  await fight({
    name:'第1章 火山の麓・見張り台',bgm:VOLC_BGM,map:mapRows.s1d,theme:TH_VOLC,hint:'癒し手は先に倒すと楽になる。術士の攻撃には気をつけよう。',
    units:()=>{const g=mkGinny(false);g.x=3;g.y=6;return [g,mkEnemy('e1','shield',2,1),mkEnemy('e2','mage',4,0),mkEnemy('e3','archer',5,2),mkEnemy('e4','medic',3,0),mkEnemy('e5','grunt',1,2)]},
    intro:[['ジニー','ここを抜ければ、砦の牢はもうすぐ！']]
  });
  await say([['ジニー','やった……！ あと少しで牢のはず。'],['','(ジニーは息をととのえ、WPとHPを回復した)']]);
  }
  /* stage 1b rescue */
  if(from<=4){setProg(4);
  await fight({
    name:'第1章 火山の麓・砦の牢',bgm:'rescue',map:mapRows.s1b,theme:TH_STONE,hint:'牢の中に赤いボンがいる！ 隣り合って「たすける」を選ぼう。見張りに気をつけて。',
    units:()=>{const g=mkGinny(false);g.x=3;g.y=6;
      const o=mkOko();o.team='n';o.caged=true;o.x=3;o.y=0;o.done=true;
      const gd=mkEnemy('e1','guard',3,1);
      return [g,o,gd,mkEnemy('e2','grunt',1,3),mkEnemy('e3','archer',5,3)]},
    intro:[['おこボン','ちょっと、そこの！ ……この檻、あけてくれない？ アタシ、閉じこめられてるんだ！']]
  });
  const oko=G.units.find(u=>u.id==='oko');
  if(oko.caged){oko.caged=false;oko.team='p';oko.hp=oko.maxhp;placeTok(oko)}
  joined.oko=true;
  await say([
    ['おこボン','見た？ アタシたちの勝ちだね！'],
    ['ジニー','うん！ 一緒にいこう、おこボン！'],
    ['','次の手がかりは二つ。町の広場の聖堂と、岩山の洞窟。どちらから向かおう？'],
  ]);
  }
  setProg(5);
  const first=from>=5?(from===5?'niko':'hyoe'):await chooseFirst();
  const order=first==='niko'?['niko','hyoe']:['hyoe','niko'];
  for(const k of order){
    await (k==='niko'?stageNiko():stageHyoe());
    const jj=G.units.find(u=>u.id===k);
    if(jj.caged){jj.caged=false;jj.team='p';jj.hp=jj.maxhp;placeTok(jj);joined[k]=true}
    await say(k==='niko'
      ?[['ジニー','にこボン、ケガはない？'],['にこボン','うん、へいき！ みんなで歌えば、きっともっと元気になるよ。']]
      :[['ジニー','ひょえボン、もうだいじょうぶだよ。'],['ひょえボン','う、うん……ふにゃ。ボン、がんばって ついていくね。']]);
  }
  endScreen();
}
const STAGES=[
 {i:0,t:'プロローグ・チュートリアル',d:'ジニーの旅立ち',c:'#4a6a3a',need:0},
 {i:1,t:'第1章 火山の麓・砦の門',d:'ジニーひとりで進む',c:'#6a3a2c',need:1},
 {i:2,t:'第1章 溶岩の道',d:'ジニーひとりで進む',c:'#7a3a2a',need:2},
 {i:3,t:'第1章 見張り台',d:'ジニーひとりで進む',c:'#6a4a3c',need:3},
 {i:4,t:'第1章 砦の牢',d:'おこボンを助ける',c:'#555a6b',need:4},
 {i:5,t:'第2章 町の広場・聖堂',d:'にこボンを助ける',c:'#7a7255',need:5},
 {i:6,t:'第2章 岩山の洞窟・廃砦',d:'ひょえボンを助ける',c:'#4a423a',need:5}];
function stageSelect(){
  const p=getProg();
  const cards=STAGES.map(st=>{const ok=p>=st.need;
    return `<button class="stc${ok?'':' lock'}" data-i="${st.i}" ${ok?'':'disabled'} style="--cc:${st.c}"><span class="no">${st.i+1}</span><span class="tn">${ok?st.t:'？？？'}<small>${ok?st.d:'まだ たどりついていない'}</small></span></button>`}).join('');
  showScreen(`<h2>ステージ選択</h2><div class="sub">好きなところから はじめられる<br>(仲間と技は、そのステージ到達時の状態になる)</div><div class="tracks">${cards}</div><button class="big sec" id="stBack">もどる</button>`);
  $('#screen').classList.add('scr-scroll');
  document.querySelectorAll('.stc').forEach(b=>b.onclick=()=>{curBgm=null;playBgm('title');runGame(+b.dataset.i)});
  $('#stBack').onclick=titleScreen;
}
function chooseFirst(){
  return new Promise(res=>{
    showScreen(`<h2>どちらを先に助ける？</h2>
    <div class="sub">(あとで、もう片方も助けにいくよ)</div>
    <div class="tracks"><button class="stc" id="cN" style="--cc:#7a7255"><span class="no">▶</span><span class="tn">町の広場・聖堂<small>にこボンが とらわれている</small></span></button>
    <button class="stc" id="cH" style="--cc:#4a423a"><span class="no">▶</span><span class="tn">岩山の洞窟・廃砦<small>ひょえボンが とらわれている</small></span></button></div>`);
    $('#screen').classList.add('scr-scroll');
    $('#cN').onclick=()=>{clearScreen();res('niko')};
    $('#cH').onclick=()=>{clearScreen();res('hyoe')};
  });
}
async function stageNiko(){
  await say([['','町の広場に着いた。聖堂の前には、反乱軍が見張りを立てている。']]);
  await fight({
    name:'第2章 町の広場',lv:1,bgm:'tactics',map:mapRows.p1,theme:TH_PLAZA,hint:'術士は遠くから攻撃してくる。盾兵は硬いので、わざで攻めよう。仲間のおこボンもタップして動かせるよ。',
    units:()=>{const g=mkGinny(false);g.x=4;g.y=7;return [g,...allies(),mkEnemy('e1','grunt',2,1),mkEnemy('e2','grunt',6,1),mkEnemy('e3','mage',4,0),mkEnemy('e4','shield',3,2),mkEnemy('e5','scout',7,3)]},
    intro:[['ジニー','広場に人影が……反乱軍だ！']]
  });
  await say([['ジニー','聖堂の中から、歌声が聞こえる……。'],['','(ジニーたちは息をととのえ、WPとHPを回復した)']]);
  await fight({
    name:'第2章 聖堂',lv:1,bgm:'rescue',map:mapRows.p2,theme:TH_STONE,hint:'牢の中に黄色いボンがいる！ 隣り合って「たすける」を選ぼう。',
    units:()=>{const g=mkGinny(false);g.x=3;g.y=6;const n=cage(mkNiko(),3,0);
      return [g,...allies(),n,mkEnemy('e1','guard',3,1,'聖堂の番人'),mkEnemy('e2','shield',1,3),mkEnemy('e3','mage',5,3),mkEnemy('e4','grunt',5,2),mkEnemy('e5','medic',2,0)]},
    intro:[['にこボン','ねえ、そこの人！ ここから出してくれないかな？ わたし、歌ってたら捕まっちゃって……']]
  });
}
async function stageHyoe(){
  await say([['','岩山の洞窟に着いた。奥から、かすかな震え声が聞こえる。']]);
  await fight({
    name:'第2章 岩山の洞窟',lv:1,bgm:'cave',map:mapRows.c1,theme:TH_CAVE,hint:'洞窟は狭い。弓手は遠くから狙ってくるので、先に倒そう。',
    units:()=>{const g=mkGinny(false);g.x=2;g.y=8;return [g,...allies(),mkEnemy('e1','archer',1,1),mkEnemy('e2','archer',3,1),mkEnemy('e3','grunt',2,3),mkEnemy('e4','shield',2,0),mkEnemy('e5','scout',0,3)]},
    intro:[['ジニー','暗い……気をつけて進もう。']]
  });
  await say([['ジニー','この奥に廃砦が……。'],['','(ジニーたちは息をととのえ、WPとHPを回復した)']]);
  await fight({
    name:'第2章 廃砦',lv:1,bgm:'rescue',map:mapRows.c2,theme:TH_STONE,hint:'牢の中に青いボンがいる！ 隣り合って「たすける」を選ぼう。',
    units:()=>{const g=mkGinny(false);g.x=3;g.y=6;const h=cage(mkHyoe(),3,0);
      return [g,...allies(),h,mkEnemy('e1','guard',3,1,'廃砦の番人'),mkEnemy('e2','archer',1,3),mkEnemy('e3','archer',5,3),mkEnemy('e4','grunt',3,3),mkEnemy('e5','medic',5,0)]},
    intro:[['ひょえボン','ひょえっ！？ だ、だれか いるの……？ ボン、ここから でられないの……']]
  });
}
function endScreen(){
  playBgm('title');setHint(null);
  const imgs=['ginny','oko','niko','hyoe','tere'].filter(k=>k==='ginny'||joined[k]).map(k=>`<img src="${IMG[k]}">`).join('');
  showScreen(`<h2>体験版は ここまで！</h2>
  <div class="sub">にこボンとひょえボンが仲間になった</div>
  <div class="party">${imgs}</div>
  <div class="list">このあと：<br>・リッチ(古い遺跡)の救出<br>・もぐボン・てれボン・ねむボン(好きな順)<br>・最後に にじボン</div>
  <div class="note">遊んでくれてありがとう！<br>数値・セリフ・敵・仲間の技は仮のものです。<br>気づいたことは、さくしゃボンに教えてね。</div>
  <button class="big" id="again">もういちど</button>
  <div class="copy">© BON CREATIONS</div>`);
  $('#again').onclick=()=>{clearScreen();titleScreen();};
}
$('#endTurn').classList.add('hidden');
setHint(null);
G=null;setInfo(null);
titleScreen();
</script>
