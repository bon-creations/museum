.zbody{flex:1;min-width:0}

.chip{font-size:12px;background:var(--c);color:#fff;border-radius:999px;padding:1px 10px}
.zdesc{margin:0 0 8px;font-size:15px}
.zk dl{margin:0;font-size:14px}.zk dl>div{display:grid;grid-template-columns:5.6em 1fr;gap:6px;padding:3px 0;border-top:1px dashed rgba(85,96,42,.3)}
.zk dt{color:var(--mute);font-weight:700}.zk dd{margin:0}
.say2{margin:10px 0 0;padding:8px 10px;background:var(--ochre-soft);border-radius:10px;font-size:14px}
.say2 b{color:var(--magenta);margin-right:4px}
.zk.rb{border-top-color:var(--magenta)}
.zk.rb .chip{background:linear-gradient(90deg,#7A2434,#B07A3C,#66752F,#55602A,#7A4DB0)}
.zintro{padding:16px 18px}.zintro p{margin:0 0 8px}
@media (max-width:520px){.zk{flex-direction:column;align-items:center}.zimg{height:230px;max-width:70%}.zbody{width:100%}.zk.zk .zimg,.zk.zk .zslot{order:0;align-self:center}}

.zk.pos-r .zposes{justify-content:flex-end}
.zk.pos-l .zposes,.zk.pos-bl .zposes{justify-content:flex-start}
@media (max-width:520px){.zk.zk .zposes{justify-content:space-between;gap:4px}.zk.zk .zposes img,.zk.zk .zposes .zmain{height:150px;max-width:31%}}
.zposes{display:flex;gap:6px;justify-content:space-between;align-items:flex-end;margin-top:10px;padding-top:10px;border-top:2px dotted rgba(122,36,52,.28)}
.zposes img{height:120px;width:auto;max-width:31%;object-fit:contain;transition:transform .15s}
.zposes .zmain{height:120px;filter:drop-shadow(0 3px 0 rgba(46,36,28,.15))}
.zposes img:hover{transform:translateY(-4px) rotate(-3deg)}
@media(prefers-reduced-motion:reduce){.zposes img{transition:none}}

.parade{display:flex;justify-content:center;align-items:flex-end;gap:2px;margin:34px auto 4px;max-width:560px}
.parade button{border:0;background:none;padding:0;cursor:pointer;flex:1 1 0;min-width:0;display:flex;justify-content:center;position:relative;-webkit-tap-highlight-color:transparent}
.parade img{height:80px;width:auto;max-width:100%;object-fit:contain;transform-origin:50% 100%;animation:pbob 2.8s ease-in-out infinite}
.parade button:nth-child(2) img{animation-delay:.25s}.parade button:nth-child(3) img{animation-delay:.5s}.parade button:nth-child(4) img{animation-delay:.75s}.parade button:nth-child(5) img{animation-delay:1s}.parade button:nth-child(6) img{animation-delay:1.25s}.parade button:nth-child(7) img{animation-delay:1.5s}
@keyframes pbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.parade .pbub{position:absolute;bottom:92%;left:50%;transform:translateX(-50%);background:#FFF8EA;color:#2E241C;border:2px solid #7A2434;border-radius:12px;padding:1px 9px;font-size:13px;line-height:1.5;white-space:nowrap;display:none;z-index:2;box-shadow:2px 2px 0 rgba(122,36,52,.25)}
.parade button.on .pbub{display:block}
.parade button:focus-visible{outline:3px solid #B07A3C;outline-offset:2px;border-radius:8px}
@media(prefers-reduced-motion:reduce){.parade img{animation:none}}
.parade button:nth-child(8) img{animation-delay:1.75s}

.nbon{float:right;height:120px;width:auto;margin:0 0 6px 10px;shape-outside:margin-box}
.nbon-cap{display:block;clear:none}
@media(max-width:380px){.nbon{height:100px}}
.zk .zposes{flex-wrap:nowrap}.zk .zposes img{max-width:23%;height:120px;width:auto;object-fit:contain}.zk.zk .zposes img{max-width:23%;height:auto;width:auto}@media (max-width:520px){.zk.zk .zposes img{height:auto;max-width:23%}}.zk .zslot>img.zimg{height:260px;width:auto;max-width:none}@media (max-width:520px){.zk.zk .zslot>img.zimg{height:240px;max-width:75%}}.zk .zslot.zpair{gap:6px}.zk .zslot.zpair>img.zimg{height:240px;width:auto;max-width:none}@media (max-width:520px){.zk.zk .zslot.zpair{justify-content:center;flex-wrap:nowrap}.zk.zk .zslot.zpair>img.zimg{height:auto;width:auto;max-width:48%;max-height:240px}}/* 長押し保存の防止 */img,svg,video{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}img{-webkit-user-drag:none}
