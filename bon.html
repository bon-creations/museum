.sticker.ch{float:right;width:132px;margin:-6px 0 6px 12px;shape-outside:margin-box}

C/g%3E%3Ccircle cx='6' cy='68' r='3' fill='%237A2434' stroke='%234F5A26' stroke-width='1.2'/%3E%3Ccircle cx='38' cy='192' r='3' fill='%237A2434' stroke='%234F5A26' stroke-width='1.2'/%3E%3C/svg%3E") repeat-y center top;opacity:.8;pointer-events:none;z-index:0}

<script>
(function(){var D=[{"id": "oko", "an": "ネコ", "st": "きらきらボン期(青年期)", "job": "ジムのインストラクター・スポーツ教室の手伝い", "n": "おこボン", "c": "#C8402F", "ch": "赤", "ini": "お", "z": "oko", "yb": "みんなの名前を呼び捨て(「にこ」「ひょえ」)", "sp": "「おこ」", "desc": "短気でツンツン。実は面倒見がよくてキレイ好き。", "me": "アタシ", "like": "辛いもの(カレー)", "bad": "待たされること、褒められること、素直にありがとうを言うこと", "tr": "最初に買った赤いリボン", "dr": "スポーツコーチ", "se": "実はホラーが苦手で、夜のトイレがこわい", "kuse": "ありがとうの代わりに「べつに」と言う", "nb": "素直にありがとうを言うこと", "first": "遅刻して、しょげた日", "hol": "ジョギングと筋トレ", "say": "怒りとは、情熱の別名である。あの者はすぐ頬をふくらませるが、実は島で一番のキレイ好きである。……本人には内緒だぞ。ばれたら、我輩の頭上に雷が落ちかねぬ！"}, {"id": "niko", "an": "イルカ", "st": "きらきらボン期(青年期)", "job": "カラオケ店の店員", "n": "にこボン", "c": "#E0A21F", "ch": "黄", "ini": "に", "desc": "お調子者で気づかい上手。誰とでもすぐ友達になる。", "me": "わたし", "like": "ポテト", "bad": "しずかすぎる場所、人がけんかしていること", "tr": "公園の5人で撮った写真", "dr": "歌とダンスで、みんなを元気にするステージに立つ", "se": "寂しい夜は、みんなの写真を眺めている", "kuse": "ほめるとき、頭をなでたがる", "nb": "人がけんかしていること", "first": "誰かの頭をなでた日", "hol": "カラオケで歌を歌う", "say": "にこの笑顔は、島の天気さえ変えるのである。誰かが沈めば真っ先に気づき、仲直りの席まで整えてしまう。我輩の虹の次くらいには、島に欠かせぬ存在であるな！", "z": "niko", "yb": "名前+ちゃん(「おこちゃん」)"}, {"id": "hyoe", "an": "りす", "st": "のびのびボン期(学童期)", "job": "まだ子供なので、バイトはしない", "n": "ひょえボン", "c": "#2F3B7C", "ch": "青", "ini": "ひ", "desc": "ボンちゃんシリーズの最年少。なんでもこわい心配性。口ぐせは「あわわ」「ふにゃ」。", "me": "ボン", "like": "おにぎり", "bad": "大きな音、暗い夜、ひとりぼっち(ぜんぶ！)", "tr": "ひとりのときに抱いていた小さな毛布", "dr": "カウンセラー", "se": "実は、にじボンの「うむ」を真似して練習している", "kuse": "ひとりのとき、そっと鼻歌をうたう", "nb": "ひとりでいること", "first": "にこボンに話しかけた日", "hol": "にこボンについていく", "say": "恐れを知る者こそ、真に用心深き者である。……されど、少々こわがりすぎではないか？ 大きな音も、暗い夜も、ぜんぶこわいとは。だが、そばに誰かがいれば勇気が出る。者とは、そうして強くなるものである。", "extra": ["口調", "幼くて未熟な話し方。"], "z": "hyoe", "yb": "名前+さん(にこだけ「にこちゃん」)"}, {"id": "mogu", "an": "たぬき", "st": "きらきらボン期(青年期)", "job": "共同農園でのお手伝い", "n": "もぐボン", "c": "#3F7B4C", "ch": "緑", "ini": "も", "desc": "なんでも好きな食いしん坊。料理が得意。", "me": "うち", "like": "なんでも！", "bad": "おなかが空いたまま待つこと、へろへろになるまで動くこと", "tr": "使いこんだ木のおたま", "dr": "自分のお店を開いて、みんなの居場所にする", "se": "実はレシピは自分では覚えていなくて、感覚で作っている", "kuse": "ポケットに種をしのばせている", "nb": "へろへろになるまで動くこと", "first": "種をまいて芽が出た日", "hol": "共同農園で、今日も苗を見る", "say": "食は文化である。ゆえに、もぐボンは島一番の文化人である。料理の腕は確かで、食べすぎた日は動きまでのんびりになる。されど、あの満足げな顔を見れば、誰も責められぬ！", "z": "mogu", "yb": "名前+っち(「おこっち」。ひょえだけ呼び捨て)", "extra": ["口ぐせ", "「あわわ〜」"]}, {"id": "nemu", "an": "カピバラ", "st": "きらきらボン期(青年期)", "job": "寝具屋さんの店員(寝心地チェック担当)", "n": "ねむボン", "c": "#7A4DB0", "ch": "紫", "ini": "ね", "desc": "マイペースなねぼすけ。どこでも寝られる。", "me": "僕", "like": "ホットミルク", "bad": "起こされること、うるさい場所", "tr": "いつも抱えているお気に入りのクッション", "dr": "世界一ことことの寝具を作る", "se": "実は、寝たふりをしてみんなの話を聞いている", "kuse": "座るとすぐクッションを抱える", "nb": "うるさい音", "first": "徹夜で起きていた夜(でも結局寝た)", "hol": "ベッドから出ない", "say": "眠りとは、夢へ渡る小舟である。ねむボンは、どこでも漕ぎ出せる稀代の船乗りである。……おや、もう寝ておる。我輩の名演説の途中だというのに。まあ、よい。夢の日記に我輩の登場回が書かれていれば、本望である。", "z": "nemu", "yb": "みんなの名前を呼び捨て"}, {"id": "tere", "an": "ヒツジ", "st": "きらきらボン期(青年期)", "job": "図書館の役職(貸し出し・本の整理)", "n": "てれボン", "c": "#D4527F", "ch": "ピンク", "ini": "て", "desc": "照れ屋であわてんぼう。恥ずかしすぎると隠れる。詩を書くのが趣味。", "me": "私", "like": "オムライス", "bad": "じっと見られること、写真を撮られること", "tr": "万年筆", "dr": "詩集を作って、だれかに読んでもらう", "se": "作詞もできる", "kuse": "照れると、袖で顔をかくす", "nb": "写真を撮られること", "first": "人前で話した日", "hol": "図書館で本を読む", "say": "あの者の詩は、なかなかの名文である。島のあちこちに、こっそり置かれておる。……見つけても、読んだと本人に告げてはならぬ。恥ずかしさのあまり、茂みの奥へ消えてしまうからな！", "z": "tere", "yb": "名前+さん(「おこさん」)"}, {"id": "rain", "an": "フクロウ", "st": "きらきらボン期(青年期)", "job": "小さな博物館のガイド", "n": "にじボン", "c": "#A8336A", "ch": "虹", "ini": "に", "desc": "虹をモチーフにした、少し大人びたボン。尊大で文豪風。このずかんの案内役。", "me": "我輩", "like": "ペロペロキャンディ", "bad": "雨がふり続くこと、高級品、黙っている沈黙の時間", "tr": "虹色の小さな石", "dr": "ボン界の歴史を一冊の本にまとめる", "se": "実はこっそり、ペロペロキャンディをときどきとっておいている", "kuse": "話のあとに「うむ」と締める", "nb": "黙っている沈黙の時間", "first": "「我輩」と名乗った日", "hol": "博物館で、梵本の歴史を眺める", "say": "我輩こそ虹の語り部である。この島を見守り、雨あがりの空に橋をかけるのが務めである。……時おり島を離れたくなる悪癖もあるが、みなが仲よければ必ず帰ってくる。それが我輩の流儀である！ 以後、お見知りおきを。", "z": "rain", "yb": "名前+ボン(「ひょえボン」)"}];
var nav=document.getElementById("bnav"),root=document.getElementById("bonroot");
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}

function row(a,b){return '<div style="display:grid;grid-template-columns:6.2em 1fr;gap:6px;padding:5px 0;border-top:1px dashed rgba(85,96,42,.35)"><dt style="color:var(--mute);font-size:14px">'+a+'</dt><dd style="margin:0">'+esc(b)+'</dd></div>'}

var dl=row('一人称',d.me)+row('よびかた',d.yb)+(d.extra?row(d.extra[0],d.extra[1]):'')+row('すきなもの',d.like)+row('にがて',d.bad)+row('にているどうぶつ',d.an)+row('せいちょう',d.st)+row('バイト',d.job)+row('たからもの',d.tr)+row('ゆめ',d.dr)+row('ひみつ',d.se)+row('くせ',d.kuse)+row('はじめて',d.first)+row('休日',d.hol);
root.innerHTML='<article class="sheet plain" style="margin-top:14px;border-color:'+d.c+'"><div style="display:flex;align-items:center;gap:14px"><div aria-hidden="true" style="flex:none;width:76px;height:76px;border-radius:50%;background:'+d.c+';color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:38px;box-shadow:0 0 0 3px var(--card),0 0 0 5px '+d.c+'">'+d.ini+'</div><div><h3 style="margin:0">'+d.n+' <span class="chip" style="font-size:14px;background:'+d.c+'">'+d.ch+'</span></h3><p style="margin:2px 0 0">'+esc(d.desc)+'</p></div></div><dl style="margin:12px 0 0;font-size:16px">'+dl+'</dl><p class="say2" style="margin-top:10px"><b>にじボン</b>「'+esc(d.say)+'」</p></article>'+
